apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    application: observability
    component: otel-operator
spec:
  project: fluxion
  
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.43.1
    helm:
      releaseName: opentelemetry-operator
      valuesObject:
        # Manager configuration
        manager:
          image:
            repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
            tag: ""  # Uses chart appVersion
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Collector image that will be used by default
          collectorImage:
            repository: otel/opentelemetry-collector-contrib
            tag: 0.91.0
        
        # Admission webhooks for auto-instrumentation
        admissionWebhooks:
          create: true
          certManager:
            enabled: true
            issuerRef:
              kind: ClusterIssuer
              name: selfsigned-issuer
          autoGenerateCert:
            enabled: true
          failurePolicy: Ignore
        
        # RBAC
        rbac:
          create: true
        
        # Service Account
        serviceAccount:
          create: true
        
        # Monitoring
        kubeRBACProxy:
          enabled: true
        
        # Prometheus monitoring
        prometheus:
          enabled: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  info:
    - name: Component
      value: OpenTelemetry Operator
    - name: Description
      value: Operator for managing OpenTelemetry Collector instances
