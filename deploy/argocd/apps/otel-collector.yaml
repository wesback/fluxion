apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    application: observability
    component: otel-collector
spec:
  project: fluxion
  
  source:
    repoURL: https://github.com/wesback/fluxion.git
    targetRevision: HEAD
    path: deploy/helm/observability/otel-collector
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  info:
    - name: Component
      value: OpenTelemetry Collector
    - name: Description
      value: Collector instance for Fluxion traces and metrics
