apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    application: observability
    component: dashboards
spec:
  project: fluxion
  
  source:
    repoURL: https://github.com/wesback/fluxion.git
    targetRevision: HEAD
    path: deploy/helm/observability/grafana-dashboards
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  info:
    - name: Component
      value: Grafana Dashboards
    - name: Description
      value: Custom Grafana dashboards for Fluxion monitoring
