apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluxion-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: staging
    application: fluxion
spec:
  project: fluxion
  
  source:
    repoURL: https://github.com/wesback/fluxion.git
    targetRevision: main  # Use main branch for staging
    path: deploy/helm/fluxion
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters: []
      releaseName: fluxion
  
  destination:
    server: https://kubernetes.default.svc
    namespace: fluxion-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
  
  info:
    - name: Environment
      value: Staging
    - name: Documentation
      value: https://github.com/wesback/fluxion
