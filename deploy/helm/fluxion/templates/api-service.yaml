{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluxion.api.fullname" . }}
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.argocd.syncWave }}
    {{- include "fluxion.argocd.syncWave" (dict "wave" .Values.argocd.syncWave.api) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fluxion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
