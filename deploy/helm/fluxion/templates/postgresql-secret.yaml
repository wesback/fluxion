{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluxion.postgresql.secretName" . }}
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if .Values.argocd.syncWave }}
  annotations:
    {{- include "fluxion.argocd.syncWave" (dict "wave" .Values.argocd.syncWave.secrets) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- $password := "" -}}
  {{- if .Values.secrets.postgresPassword -}}
    {{- $password = .Values.secrets.postgresPassword -}}
  {{- else if .Values.postgresql.auth.password -}}
    {{- $password = .Values.postgresql.auth.password -}}
  {{- else -}}
    {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "fluxion.postgresql.secretName" .)) -}}
    {{- if $existing -}}
      {{- $password = (index $existing.data "postgres-password" | b64dec) -}}
    {{- else -}}
      {{- $password = randAlphaNum 32 -}}
    {{- end -}}
  {{- end -}}
  postgres-password: {{ $password | b64enc | quote }}
{{- end }}
