{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluxion.api.secretName" . }}
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if .Values.argocd.syncWave }}
  annotations:
    {{- include "fluxion.argocd.syncWave" (dict "wave" .Values.argocd.syncWave.secrets) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- $password := "" }}
  {{- if .Values.secrets.postgresPassword }}
    {{- $password = .Values.secrets.postgresPassword }}
  {{- else if .Values.postgresql.auth.password }}
    {{- $password = .Values.postgresql.auth.password }}
  {{- else }}
    {{- $pgSecret := (lookup "v1" "Secret" .Release.Namespace (include "fluxion.postgresql.secretName" .)) }}
    {{- if $pgSecret }}
      {{- $password = (index $pgSecret.data "postgres-password" | b64dec) }}
    {{- else }}
      {{- $password = randAlphaNum 32 }}
    {{- end }}
  {{- end }}
  postgres-password: {{ $password | b64enc | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.postgresql.auth.username $password (include "fluxion.postgresql.serviceName" .) (int .Values.postgresql.service.port) .Values.postgresql.auth.database | b64enc | quote }}
  {{- if .Values.secrets.adminApiKey }}
  admin-api-key: {{ .Values.secrets.adminApiKey | b64enc | quote }}
  {{- else }}
  admin-api-key: {{ printf "CHANGE_ME_%s" (randAlphaNum 32) | b64enc | quote }}
  {{- end }}
{{- end }}
