# Development environment overrides
global:
  registry: "fluxiondevaksacr.azurecr.io"

api:
  replicaCount: 1

image:
  pullPolicy: Always
  tag: "latest"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    tag: "hostname-fix"
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  config:
    apiUrl: "http://fluxion-api:8000"
  autoscaling:
    enabled: false
  # Increase health probe delays to allow time for Next.js and Nginx startup
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 40
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

postgresql:
  replicaCount: 1
  persistence:
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

config:
  api:
    logLevel: debug
    corsOrigins:
      - "*"
  otel:
    environment: "development"
    exporterType: "console"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns01-prod"
  hosts:
    - host: fluxion-dev.aks.backelant.eu
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /api/v1
          pathType: Prefix
          backend: api
  tls:
    enabled: true
    secretName: fluxion-tls
    certManager:
      enabled: true
      issuer: letsencrypt-dns01-prod
      issuerKind: ClusterIssuer

otelCollector:
  enabled: true

autoscaling:
  enabled: false

argocd:
  autoSync:
    enabled: true
    prune: true
    selfHeal: true
