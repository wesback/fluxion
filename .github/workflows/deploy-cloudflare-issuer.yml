name: Deploy Cloudflare DNS01 Issuer

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/cert-manager-cloudflare-issuer.yaml'
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Install kubelogin
        run: |
          sudo az aks install-cli
      
      - name: Set up kubeconfig
        run: |
          az aks get-credentials \
            --resource-group fluxion-dev-rg \
            --name fluxion-dev-aks \
            --file $HOME/.kube/config \
            --overwrite-existing
      
      - name: Create or update Cloudflare API Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Use kubectl to apply the secret directly without trying to get the existing one
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-api-token
            namespace: cert-manager
          type: Opaque
          stringData:
            api-token: ${CLOUDFLARE_API_TOKEN}
          EOF
      
      - name: Update ClusterIssuer with Cloudflare credentials
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat deploy/cert-manager-cloudflare-issuer.yaml | \
            sed "s/\${CLOUDFLARE_EMAIL}/$CLOUDFLARE_EMAIL/g" | \
            sed "s/\${CLOUDFLARE_API_TOKEN}/$CLOUDFLARE_API_TOKEN/g" | \
            kubectl apply -f -
      
      - name: Verify deployment
        run: |
          kubectl get clusterissuer letsencrypt-dns01-prod
          kubectl get secret -n cert-manager cloudflare-api-token
