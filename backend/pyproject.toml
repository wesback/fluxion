[project]
name = "fluxion"
version = "0.1.0"
description = "Linux package update tracking system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wesley Backelant"}
]

dependencies = [
    "sqlalchemy[asyncio]>=2.1.5,<3.0.0",
    "alembic>=1.20.0,<2.0.0",
    "asyncpg>=0.32.0,<1.0.0",
    "psycopg2-binary>=2.9.13,<3.0.0",
    "fastapi>=0.143.3,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.0,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "httpx>=0.28.1,<1.0.0",
    "opentelemetry-api>=1.45.1,<2.0.0",
    "opentelemetry-sdk>=1.45.1,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<1.0.0",
    "opentelemetry-exporter-otlp>=1.45.1,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.1,<1.0.0",
    "mypy>=2.4.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fluxion*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
