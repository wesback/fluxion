version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: fluxion-postgres
    environment:
      POSTGRES_DB: fluxion
      POSTGRES_USER: fluxion
      POSTGRES_PASSWORD: fluxion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger all-in-one for tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: fluxion-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "14250:14250"  # Model collector
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fluxion backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxion-api
    environment:
      DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@postgres:5432/fluxion
      SQL_ECHO: "false"
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      LOG_LEVEL: info
      # OpenTelemetry settings
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_TYPE: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: fluxion
      OTEL_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
